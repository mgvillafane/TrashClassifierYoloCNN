# This is a Declarative Automation Bundle definition for TrashClassifierYoloCNN.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: TrashClassifierYoloCNN

variables:
  taco_root:
    description: Unity Catalog volume holding raw TACO data, prepared labels, and runs.
    default: /Volumes/workspace/default/tacotrashdata

resources:
  jobs:
    taco_small_gpu:
      name: taco_small_gpu
      description: Train YOLO26 Medium for up to 40 epochs with six TrashNet labels and early stopping after 8 epochs without improvement.
      max_concurrent_runs: 1
      timeout_seconds: 7200
      tasks:
        - task_key: train_taco
          compute:
            hardware_accelerator: GPU_1xA10
          environment_key: gpu
          notebook_task:
            notebook_path: ./taco_databricks.py
            source: WORKSPACE
            base_parameters:
              code_dir: ${workspace.file_path}
              taco_root: ${var.taco_root}
      environments:
        - environment_key: gpu
          spec:
            environment_version: '6'

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-fd89e1b5-e4fc.cloud.databricks.com

